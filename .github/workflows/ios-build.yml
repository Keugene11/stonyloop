name: iOS Build & Upload to App Store

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Fix app icon (upscale + remove alpha)
        run: |
          ICON=ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          sips -z 1024 1024 $ICON
          # Remove alpha channel by flattening onto dark background using CoreGraphics via python
          python3 << 'PYEOF'
          import subprocess
          icon = "ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"
          # Use macOS built-in CoreImage via objc bridge
          subprocess.run(["sips", "-s", "format", "png", icon, "--out", icon], check=True)
          # Use ImageMagick if available, otherwise cgimage
          try:
              subprocess.run(["magick", icon, "-background", "#1a1a1a", "-flatten", "-alpha", "off", icon], check=True)
          except FileNotFoundError:
              # Fallback: use Quartz/CoreGraphics
              import Quartz
              from CoreFoundation import CFDataGetBytes, CFDataGetLength
              url = Quartz.CFURLCreateWithFileSystemPath(None, icon, Quartz.kCFURLPOSIXPathStyle, False)
              src = Quartz.CGImageSourceCreateWithURL(url, None)
              img = Quartz.CGImageSourceCreateImageAtIndex(src, 0, None)
              w, h = Quartz.CGImageGetWidth(img), Quartz.CGImageGetHeight(img)
              cs = Quartz.CGColorSpaceCreateDeviceRGB()
              ctx = Quartz.CGBitmapContextCreate(None, w, h, 8, w*4, cs, Quartz.kCGImageAlphaNoneSkipLast)
              Quartz.CGContextSetRGBFillColor(ctx, 26/255, 26/255, 26/255, 1)
              Quartz.CGContextFillRect(ctx, ((0,0),(w,h)))
              Quartz.CGContextDrawImage(ctx, ((0,0),(w,h)), img)
              out = Quartz.CGBitmapContextCreateImage(ctx)
              dest = Quartz.CGImageDestinationCreateWithURL(url, "public.png", 1, None)
              Quartz.CGImageDestinationAddImage(dest, out, None)
              Quartz.CGImageDestinationFinalize(dest)
          PYEOF

      - name: Install Apple certificate and provisioning profile
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          # Create temp keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 12)
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          python3 -c "import base64,os,sys; open(os.environ['RUNNER_TEMP']+'/certificate.p12','wb').write(base64.b64decode(os.environ['CERTIFICATE_P12']))"
          security import $CERT_PATH -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH

          # Install provisioning profile
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          python3 -c "import base64,os; open(os.environ['RUNNER_TEMP']+'/profile.mobileprovision','wb').write(base64.b64decode(os.environ['PROVISIONING_PROFILE']))"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PP_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i $PP_PATH))
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PP_UUID.mobileprovision

      - name: Resolve Swift packages
        run: |
          cd ios/App
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme App

      - name: Build archive
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -destination 'generic/platform=iOS' \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=${{ secrets.TEAM_ID }} \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="StonyLoop AppStore"

      - name: Export IPA
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${{ secrets.TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.stonyloop.app</key>
              <string>StonyLoop AppStore</string>
            </dict>
            <key>signingCertificate</key>
            <string>iPhone Distribution</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

          xcrun notarytool store-credentials "AC_API_KEY" \
            --key ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" 2>/dev/null || true

          xcrun altool --upload-app \
            -f $RUNNER_TEMP/export/App.ipa \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            -t ios
